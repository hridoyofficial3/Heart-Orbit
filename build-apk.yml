name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html style.css i18n.js app.js native.js manifest.json sw.js \
             icon-192.png icon-512.png apple-touch-icon.png maskable-512.png www/
          # tell the APK which build it is, so it can detect newer releases
          printf 'window.HO_BUILD={n:%s,repo:"%s"};\n' "${{ github.run_number }}" "${{ github.repository }}" | cat - native.js > www/native.js

      - name: Install Capacitor
        run: |
          npm install
          npx cap add android

      - name: Icons, splash and version
        run: |
          pip install pillow
          python make_android_res.py android/app/src/main/res
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Notification permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$M"

      - name: Sync web files
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign
        run: |
          base64 -d heart-orbit.keystore.b64 > heart-orbit.keystore
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks heart-orbit.keystore \
            --ks-key-alias heartorbit \
            --ks-pass pass:heartorbit-ks-2026 \
            --key-pass pass:heartorbit-ks-2026 \
            --out Heart-Orbit.apk aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify Heart-Orbit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Heart-Orbit-apk
          path: Heart-Orbit.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Heart Orbit ${{ github.run_number }}
          files: Heart-Orbit.apk
          make_latest: true
